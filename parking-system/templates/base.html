<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Parking lot{% endblock %}</title>
<style>
:root{--bg:#14181d;--panel:#1e242b;--line:#e9e7e0;--muted:#8d97a3;--plate:#f2c230;--busy:#e5604d;--free:#58b59a;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--line);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
nav{display:flex;gap:1.25rem;align-items:center;padding:.9rem 1.25rem;border-bottom:1px solid #2c343d}
nav b{font-size:1.1rem;margin-right:auto}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover,nav a:focus-visible{color:var(--line)}
main{max-width:1080px;margin:0 auto;padding:1.25rem}
h2{font-size:1.15rem;margin:1.75rem 0 .75rem}
.panel{background:var(--panel);border-radius:var(--r);padding:1rem 1.1rem}
.flash{padding:.7rem 1rem;border-radius:var(--r);margin-bottom:.75rem;background:#22382f;border:1px solid var(--free)}
.flash.error{background:#3d2420;border-color:var(--busy)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
input,select,button{font:inherit;color:inherit;background:#12161b;border:1px solid #38414b;border-radius:8px;padding:.55rem .7rem;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--plate);outline-offset:1px}
button{background:var(--plate);color:#1a1500;border:0;font-weight:700;cursor:pointer;width:auto}
button.ghost{background:transparent;color:var(--line);border:1px solid #4a5560;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid #2c343d;white-space:nowrap}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
</style>
</head>
<body>
{% if session.get('in') %}
<nav><b>Parking lot</b><a href="{{ url_for('index') }}">Lot</a><a href="{{ url_for('transactions') }}">History</a><a href="{{ url_for('logout') }}">Log out</a></nav>
{% endif %}
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
